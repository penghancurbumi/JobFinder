# =============================================================================
# Nginx untuk JobFinder — serve Vue SPA + reverse proxy ke backend
# File ini otomatis dipakai oleh image frontend (lihat frontend/Dockerfile).
# "backend" di bawah adalah nama service di docker-compose.yml.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ukuran upload CV (limit multer backend = 5MB; beri ruang lebih)
    client_max_body_size 10m;

    # --- Socket.IO (WebSocket + polling fallback)
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket butuh koneksi panjang -> naikkan timeout
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    # --- REST API
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scraping trigger bisa lama (backend balas instan, tapi jaga-jaga)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Static assets hasil build Vite (hash di nama file -> cache lama)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: semua route lain -> index.html (vue-router history)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Health check
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
